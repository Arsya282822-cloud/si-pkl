name: Laravel Self-Hosted Deploy - SI-PKL SMK

on:
  push:
    branches: [ "main" ]

# Batasi agar hanya 1 deployment berjalan dalam satu waktu
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  # =============================================================
  # SELF-HOSTED RUNNER DEPLOYMENT
  # =============================================================
  deploy:
    name: Deploy on Self-Hosted Server
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Put Application in Maintenance Mode (Minimal Downtime)
        run: php artisan down || true

      - name: Install / Update Composer Dependencies
        env:
          COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ secrets.GITHUB_TOKEN }}"}}'
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: Build Frontend Vite Assets
        run: |
          npm ci || npm install
          npm run build

      - name: Run Database Migrations & Seeders
        run: |
          php artisan migrate --force
          php artisan db:seed --class=TujuanPembelajaranSeeder --force

      - name: Ensure Storage Symlink Exists
        run: php artisan storage:link || true

      - name: Optimize & Clear Cache
        run: |
          php artisan optimize:clear
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache

      - name: Set Correct Storage & Cache Permissions
        run: |
          chmod -R 775 storage bootstrap/cache || true

      - name: Bring Application Online
        run: php artisan up
